[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novelty-assessment-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "pydantic-settings>=2,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/novelty_harness"]

[dependency-groups]
dev = ["pyright", "pytest", "pytest-asyncio", "pytest-socket", "ruff"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP042"]  # The approved contracts explicitly use str, Enum.

[tool.ruff.format]
exclude = ["*.md"]

[tool.pyright]
include = ["src/novelty_harness"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --disable-socket --allow-unix-socket"
markers = [
    "unit: deterministic unit tests",
    "contract: provider transport contract tests",
    "integration: local contract integration tests",
    "network: future explicitly opt-in live network tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
